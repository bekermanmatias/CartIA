name: Deploy production
on:
  push:
    branches: [main]
permissions: { contents: read, packages: write }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/api.Dockerfile, push: true, tags: ghcr.io/${{ github.repository_owner }}/cartia-api:${{ github.sha }} }
      - uses: docker/build-push-action@v6
        with: { context: ., file: docker/web.Dockerfile, push: true, tags: ghcr.io/${{ github.repository_owner }}/cartia-web:${{ github.sha }} }
      - uses: appleboy/ssh-action@v1.2.2
        env:
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/cartia-api:${{ github.sha }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/cartia-web:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: API_IMAGE,WEB_IMAGE
          script: export VPS_DEPLOY_PATH='${{ secrets.VPS_DEPLOY_PATH }}'; sh "$VPS_DEPLOY_PATH/scripts/vps-release.sh"
