name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cartia-api:${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web.production.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cartia-web:${{ github.event.workflow_run.head_sha }}
          build-args: |
            VITE_ROOT_DOMAIN=${{ vars.PUBLIC_BASE_DOMAIN || 'cartia.ar' }}
            VITE_PLATFORM_ORIGIN=https://app.${{ vars.PUBLIC_BASE_DOMAIN || 'cartia.ar' }}
            VITE_SALES_WHATSAPP_URL=${{ vars.SALES_WHATSAPP_URL }}
      - uses: appleboy/ssh-action@v1.2.2
        env:
          API_IMAGE: ghcr.io/${{ github.repository_owner }}/cartia-api:${{ github.event.workflow_run.head_sha }}
          WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/cartia-web:${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          envs: API_IMAGE,WEB_IMAGE
          script: export VPS_DEPLOY_PATH='${{ secrets.VPS_DEPLOY_PATH }}'; git -C "$VPS_DEPLOY_PATH" pull --ff-only origin main; sh "$VPS_DEPLOY_PATH/scripts/vps-release.sh"
